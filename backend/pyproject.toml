[project]
name = "precedent-ai-backend"
version = "0.1.0"
description = "Precedent AI — agentic backend (LangGraph + GPT reasoning + ZebraAI MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2.28",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
